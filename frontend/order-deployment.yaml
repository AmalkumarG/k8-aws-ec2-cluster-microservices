apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: amalkumargp/orderms:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: PORT
          value: "3000"

        - name: DB_HOST
          value: "postgres"

        - name: DB_PORT
          value: "5432"

        - name: DB_USER
          value: "postgres"

        - name: DB_PASSWORD
          value: "postgres"

        - name: DB_NAME
          value: "ordersdb"

        - name: USER_SERVICE_URL
          value: "http://user-service:3000"

        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
